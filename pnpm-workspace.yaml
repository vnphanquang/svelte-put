packages:
  - 'internals/*'
  - 'packages/*'
  - 'sites/*'
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - 'svelte'
  - '@sveltejs/adapter-auto'
  - '@sveltejs/adapter-cloudflare'
  - '@sveltejs/kit'
  - '@sveltejs/enhanced-img'
  - '@sveltejs/vite-plugin-svelte'
  - 'vite'
