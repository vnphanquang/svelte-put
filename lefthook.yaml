assert_lefthook_installed: true
min_version: 2.0.0
glob_matcher: doublestar
pre-commit:
  piped: true
  follow: true
  skip:
    - merge
    - rebase
  jobs:
    - name: 1_eslint
      group:
        parallel: true
        jobs:
          - name: '@svelte-put/preprocess-auto-slug'
            root: packages/preprocess-auto-slug
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
            glob: 'packages/preprocess-auto-slug/*.{js,ts,svelte}'

          - name: '@svelte-put/preprocess-external-link'
            root: packages/preprocess-external-link
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
            glob: 'packages/preprocess-external-link/*.{js,ts,svelte}'

          - name: '@svelte-put/inline-svg'
            root: packages/inline-svg
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
            glob: 'packages/inline-svg/*.{js,ts,svelte}'

          - name: '@svelte-put/toc'
            root: packages/toc
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
            glob: 'packages/toc/*.{js,ts,svelte}'

          - name: docs
            root: sites/docs
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
            glob: 'sites/docs/*.{js,ts,svelte}'

          - name: catchall
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
            glob: '*.{js,ts}'
    - name: 2_stylelint
      run: pnpm stylelint --fix {staged_files}
      glob: '**/*.{css,svelte}'
      stage_fixed: true
    - name: 3_prettier
      run: pnpm prettier --write {staged_files}
      glob: '**/*.{js,ts,json,md,yaml,svelte}'
      stage_fixed: true
      exclude:
        - pnpm-lock.yaml
