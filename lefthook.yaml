assert_lefthook_installed: true
min_version: 2.0.0
glob_matcher: doublestar
pre-commit:
  piped: true
  follow: true
  skip:
    - merge
    - rebase
  jobs:
    - name: 1_eslint
      group:
        parallel: true
        jobs:
          - name: '@internals/docpage'
            root: internals/docpage
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
            glob: 'internals/docpage/**/*.{js,ts,svelte}'

          - name: '@svelte-put/avatar'
            root: packages/avatar
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
            glob: 'packages/avatar/**/*.{js,ts,svelte}'

          - name: '@svelte-put/clickoutside'
            root: packages/clickoutside
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
            glob: 'packages/clickoutside/**/*.{js,ts,svelte}'

          - name: '@svelte-put/copy'
            root: packages/copy
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
            glob: 'packages/copy/**/*.{js,ts,svelte}'

          - name: '@svelte-put/dragscroll'
            root: packages/dragscroll
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
            glob: 'packages/dragscroll/**/*.{js,ts,svelte}'

          - name: '@svelte-put/inline-svg'
            root: packages/inline-svg
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
            glob: 'packages/inline-svg/**/*.{js,ts,svelte}'

          - name: '@svelte-put/intersect'
            root: packages/intersect
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
            glob: 'packages/intersect/**/*.{js,ts,svelte}'

          - name: '@svelte-put/lockscroll'
            root: packages/lockscroll
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
            glob: 'packages/lockscroll/**/*.{js,ts,svelte}'

          - name: '@svelte-put/movable'
            root: packages/movable
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
            glob: 'packages/movable/**/*.{js,ts,svelte}'

          - name: '@svelte-put/preprocess-external-link'
            root: packages/preprocess-external-link
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
            glob: 'packages/preprocess-external-link/**/*.{js,ts,svelte}'

          - name: '@svelte-put/swipeable'
            root: packages/swipeable
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
            glob: 'packages/swipeable/**/*.{js,ts,svelte}'

          - name: '@svelte-put/toc'
            root: packages/toc
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
            glob: 'packages/toc/**/*.{js,ts,svelte}'

          - name: '@svelte-put/qr'
            root: packages/qr
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
            glob: 'packages/qr/**/*.{js,ts,svelte}'

          - name: docs
            root: sites/docs
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
            glob: 'sites/docs/**/*.{js,ts,svelte}'

          - name: catchall
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
            glob: '**/*.{js,ts}'
    - name: 2_stylelint
      run: pnpm stylelint --fix {staged_files}
      glob: '**/*.{css,svelte}'
      stage_fixed: true
    - name: 3_prettier
      run: pnpm prettier --write {staged_files}
      glob: '**/*.{js,ts,json,md,yaml,svelte}'
      stage_fixed: true
      exclude:
        - pnpm-lock.yaml
